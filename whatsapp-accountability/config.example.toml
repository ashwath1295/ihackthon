# Copy to config.toml and replace the names and numbers with your team.
# Phone numbers: country code + number, digits only (e.g. 15551234567).

[app]
db_path = "accountability.db"
use_claude = false              # true = Claude reads your messages (needs ANTHROPIC_API_KEY)
claude_model = "claude-opus-5-5"

# Google Chat: read every message in your spaces as yourself (read-only). See README.
# [google_chat]
# client_secrets = "client_secret.json"   # OAuth client (Desktop app) from Google Cloud
# token = "google-chat-token.json"        # created by `google-chat-login`
# spaces = ["spaces/AAAA1234"]            # leave out to track every space you're in

# Live dashboard: the tracker writes these Google Sheets every few minutes.
# Uncomment after sharing each sheet with your service account (see README).
# [sheets]
# credentials = "service-account.json"
# scorecard = "1Qhb4thJXjiJRq6jAYHGtJ25lRfyI6y3PPQusNMe2RFQ"
# open_messages = "1j7DPZphS3wd8chpRQNBfI1haZuv6kQqV6J-HJTwsRgU"
# message_responses = "1zzv4FFBW89PN_Ww6ni8lutQYj98682t76W1sn2ACVgE"
# sync_minutes = 5

[policy]
ack_minutes = 15                # must acknowledge within 15 work minutes
reminder_minutes = 30           # personal reminder at 30
escalate_minutes = 60           # final notice + escalate to manager and Juan at 60
urgent_ack_minutes = 5          # messages with "urgent", "ASAP", 🚨 use these, 24/7
urgent_reminder_minutes = 10
urgent_escalate_minutes = 20
failure_threshold = 3           # 3 missed acknowledgments...
failure_window_days = 30        # ...in 30 days = flagged for review
timezone = "America/New_York"
work_start = "08:00"
work_end = "18:00"
work_days = [0, 1, 2, 3, 4, 5]  # Mon-Sat
group_no_response_alert = true  # alert Juan when NOBODY answers

# Each person can be tracked on several platforms at once:
#   email  = "name@company.com"            matches Google Chat (and Teams) automatically
#   ids    = ["slack:U012AB3CD", "telegram:5551234", "teams:<aad-object-id>"]
#   notify = "slack"                       where their reminders go (default: NOTIFIER)

